[project]
name = "apprentissage-supervise"
version = "0.1.0"
description = "Support de travail pour les TP d'apprentissage supervise."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "plotly>=7.1.0",
    "umap-learn>=0.5.12",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
